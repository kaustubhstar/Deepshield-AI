services:
  - type: web
    name: deepshield-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEVICE
        value: cpu
      - key: CORS_ORIGINS
        sync: false
